name: Sync Upstream
# 鑷姩鍚屾涓婃父 jxxghp/MoviePilot-Plugins 鐨勬洿鏂板埌鏈?fork銆?
# 绛栫暐锛歠etch upstream -> 灏濊瘯 merge銆?
#   - 骞插噣 merge锛氳嚜鍔?push 鍒?main銆?
#   - 鏈夊啿绐侊細鎺ㄩ€?sync-upstream 鍒嗘敮锛屽苟鐢?SYNC_TOKEN(PAT) 鑷姩寮€ PR 渚涗汉宸ヨВ鍐炽€?
#
# 鍦?浠撳簱 Settings > Secrets and variables > Actions 娣诲姞锛?
#   SYNC_TOKEN = Personal Access Token (classic 闇€ repo + workflow 鏉冮檺)銆?
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jxxghp/MoviePilot-Plugins.git
          git fetch upstream main
      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date, nothing to sync."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits."
          fi
      - name: Sync (merge or open sync PR)
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          set -uo pipefail
          if git merge upstream/main --no-edit; then
            echo "鉁?Clean merge 鈥?pushing to main."
            git push origin main
            echo "::notice::Synced upstream to main successfully."
            exit 0
          fi
          echo "鈿狅笍 Merge conflicts 鈥?pushing sync-upstream branch for manual resolution."
          git merge --abort
          SYNC_BRANCH="sync-upstream"
          git checkout -B "$SYNC_BRANCH" upstream/main
          git push --force origin "$SYNC_BRANCH"
          if [ "$HAS_PAT" = "true" ]; then
            printf '%s\n' \
              '## 猬嗭笍 鍚屾涓婃父 jxxghp/MoviePilot-Plugins' \
              '' \
              '姝?PR 鐢?Sync Upstream workflow 鑷姩鍒涘缓/鍒锋柊锛岀敤浜庢妸涓婃父鏇存柊鍚堝叆 main銆? \
              '' \
              '- 鍚湁闇€瑕佹墜鍔ㄨВ鍐冲啿绐佺殑鏂囦欢銆? \
              '- 璇峰湪 GitHub 鐨?Resolve conflicts 鐣岄潰澶勭悊鍚庡啀鍚堝苟銆? \
              > /tmp/pr-body.md
            existing_pr="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number -q '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "$existing_pr" ]; then
              gh pr edit "$existing_pr" --body-file /tmp/pr-body.md
              gh pr comment "$existing_pr" --body "馃攧 涓婃父鏈夋柊鏇存柊锛屽啿绐佸凡鍒锋柊锛岃閲嶆柊瑙ｅ喅鍚庡悎骞躲€?
              echo "::notice::Refreshed existing sync PR #$existing_pr."
            else
              gh pr create --base main --head "$SYNC_BRANCH" \
                --title "猬嗭笍 鍚屾涓婃父 jxxghp/MoviePilot-Plugins" \
                --body-file /tmp/pr-body.md
              echo "::notice::Created new sync PR for conflict resolution."
            fi
          else
            echo "::error::妫€娴嬪埌鍐茬獊浣嗘湭閰嶇疆 SYNC_TOKEN锛屾棤娉曡嚜鍔ㄥ紑 PR銆傝鎵嬪姩鎵撳紑 https://github.com/${GITHUB_REPOSITORY}/compare/main...sync-upstream 鏂板缓 PR銆?
            exit 1
          fi
